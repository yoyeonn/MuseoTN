<h2>Modifier le mot de passe</h2>

<form [formGroup]="form" (ngSubmit)="submit()">

  <div class="mb-3">
    <label>Ancien mot de passe</label>
    <input type="password" class="form-control" formControlName="old">
  </div>

  <div class="mb-3">
    <label>Nouveau mot de passe</label>
    <input type="password" class="form-control" formControlName="new1">
  </div>

  <div class="mb-3">
    <label>Confirmer nouveau mot de passe</label>
    <input type="password" class="form-control" formControlName="new2">
  </div>

  <button class="btn btn-primary">Modifier</button>
</form>
